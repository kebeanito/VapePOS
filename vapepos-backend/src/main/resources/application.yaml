spring:
  application:
    name: vapepos-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vapepos_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: ${JWT_SECRET}

server:
  port: 8080
